<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FBFAF6" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <title>LET Reviewer</title>
    <script>
      // Text size, saved by App.tsx, applied before the first paint so it does not flash.
      try {
        var d = JSON.parse(localStorage.getItem('let-display'));
        if (d && +d.textSize) document.documentElement.style.fontSize = +d.textSize + '%';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root" class="isolate"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
